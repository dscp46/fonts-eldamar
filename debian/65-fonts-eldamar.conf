<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Eldamar encodes J.R.R. Tolkien's writing systems in the Unicode
    Private Use Area following the ConScript Unicode Registry (CSUR).
    The CSUR Tengwar block is U+E000-U+E07F.

    Because these are Private Use Area code points, fontconfig's normal
    coverage-based fallback will already pick Eldamar for CSUR Tengwar
    text once the font is installed (no other installed font is likely
    to advertise coverage of that range). The rules below make the
    intent explicit and give applications a stable, human-readable
    family name to request that range by.
  -->

  <!-- Requesting the generic family "Tengwar" (or "CSUR Tengwar")
       resolves to Eldamar. -->
  <alias binding="same">
    <family>Tengwar</family>
    <default>
      <family>Eldamar 1.1</family>
    </default>
  </alias>

  <alias binding="same">
    <family>CSUR Tengwar</family>
    <default>
      <family>Eldamar 1.1</family>
    </default>
  </alias>

  <!-- When text falls in the CSUR Tengwar range and no explicit family
       has been requested, prepend Eldamar so it is preferred as the
       default face for that script. -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <range>
          <int>0xE000</int>
          <int>0xE07F</int>
        </range>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Eldamar 1.1</string>
    </edit>
  </match>

</fontconfig>
